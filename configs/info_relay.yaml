# =============================================================================
#  info_relay 配置：串口 / CAN 通信中转进程
#
#  启动：./build/info_relay configs/info_relay.yaml
#  职责：整机唯一持有下位机通信链路的进程；解析协议后通过 iceoryx2 发布，
#        并把外部进程写入的指令通过同一链路发回下位机。
#
#  与视觉/导航配置的关系：本文件只含"通信"参数；外部侧的 relay_prefix /
#  relay_timeout_ms 必须与本文件一致，否则两边连不上。
# =============================================================================

#####-----通信链路-----#####
# 链路类型：serial 串口 / can CAN 总线；缺省 serial
link_type: "serial"
# 串口设备路径：link_type=serial 时必填
com_port: "/dev/ttyACM0"
# 串口波特率：必须与下位机一致；link_type=can 时忽略
baud_rate: 921600
# CAN 网络接口名：link_type=can 时必填，例如 can0
can_interface: "can0"
# CAN 发送 ID（11 位标准帧）：link_type=can 时生效
can_id: 291
# 单次读取等待上限，ms
io_timeout_ms: 50

#####-----下位机协议-----#####
# 下行帧 ID 为固件协议常量，不在运行配置中修改：0x0400 自瞄 / 0x0401 导航
# 默认弹速，m/s
bullet_speed: 23.0
# 热量保护提前量，17mm 单发约 10 点热量
heat_stop_margin: 10
# 是否依赖裁判系统判定开赛：false 时始终视为已开赛
use_referee_system: false
# 比赛中对应的 game_progress
game_start_progress_threshold: 4
# IMU 安装轴：upper 小 yaw 板 / lower 大 yaw 轴
gimbal_imu_axis: lower

#####-----跨进程通信-----#####
# 主题名前缀：实际主题为 <prefix>/imu、<prefix>/cmd_aim 等
relay_prefix: "rm_vision"
# 链路失效阈值，ms：超过该时长没收到任何上行帧即判链路中断
relay_timeout_ms: 200

#####-----日志-----#####
# 留空表示 <仓库根>/logs；也可写绝对路径或相对仓库根的路径
log_dir: ""
